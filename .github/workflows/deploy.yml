name: Build and Deploy VPN Module

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'backend/**'
      - 'src/**'
      - 'k8s/**'
      - 'manifest.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/network-controller
  MINIO_BUCKET: nekazari-frontend

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build module
        run: npm run build

      - name: Upload frontend as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-frontend-module
          path: ./dist/
          retention-days: 90

      - name: Check MinIO Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.MINIO_ROOT_USER }}" ] && [ -n "${{ secrets.MINIO_ROOT_PASSWORD }}" ] && [ -n "${{ secrets.MINIO_URL }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup MinIO Client
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: Upload to MinIO
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          mc alias set nkz "${{ secrets.MINIO_URL }}" "${{ secrets.MINIO_ROOT_USER }}" "${{ secrets.MINIO_ROOT_PASSWORD }}"
          mc cp --recursive ./dist/ nkz/${{ env.MINIO_BUCKET }}/modules/vpn/
          mc anonymous set public nkz/${{ env.MINIO_BUCKET }}/modules/vpn/
