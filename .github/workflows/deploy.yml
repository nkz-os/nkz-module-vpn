name: Build and Deploy VPN Module

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - 'manifest.json'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/network-controller
  MINIO_BUCKET: marketplace-modules

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build module
        working-directory: ./frontend
        run: npm run build:module

      - name: Upload frontend as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-frontend-module
          path: ./frontend/dist/
          retention-days: 90

      - name: Upload to MinIO (Official Repo Only)
        if: github.repository == 'nkz-os/nkz-module-vpn'
        uses: prewk/s3-cp-action@master
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ROOT_USER }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_ROOT_PASSWORD }}
          AWS_REGION: us-east-1
          S3_ENDPOINT: ${{ secrets.MINIO_URL }}
        with:
          args: --recursive --acl public-read
          source: './frontend/dist'
          dest: 's3://${{ env.MINIO_BUCKET }}/vpn'
