apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-backend-ingress
  namespace: nekazari
  labels:
    app: vpn-backend
    module: vpn
spec:
  # User routes are reached through the api-gateway (signed X-Auth-Signature);
  # /internal/* is reached by robotics (X-Internal-Service-Secret). Nobody else
  # in the namespace needs this pod.
  podSelector:
    matchLabels:
      app: vpn-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: robotics-api
      ports:
        - port: 8000
          protocol: TCP
