# =============================================================================
# Device Management (vpn module) — backend
# =============================================================================
# Secrets (not in this file): db-nkz-module-vpn (own database nkz_vpn),
# nkz-network-controller-secret (headscale-api-key, factory-secret-v1),
# redis-secret, jwt-secret (gateway signature), internal-service-secret.
# Non-secret config: vpn-config.yaml.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-backend
  namespace: nekazari
  labels:
    app: vpn-backend
    module: vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpn-backend
  template:
    metadata:
      labels:
        app: vpn-backend
        module: vpn
        nkz-os.org/postgres-client: "true"
        nkz-os.org/redis-client: "true"
        nkz-os.org/orion-client: "true"
    spec:
      serviceAccountName: vpn-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Schema migrations run before the API starts; the API container does no DDL.
        - name: migrate
          image: ghcr.io/YOUR_ORG/nkz-module-vpn/network-controller:YOUR_TAG
          command: ["python", "-m", "app.db.migrate"]
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: db-nkz-module-vpn
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/nkz-module-vpn/network-controller:YOUR_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vpn-config
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: db-nkz-module-vpn
                  key: url
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nkz-network-controller-secret
                  key: headscale-api-key
            - name: FACTORY_SECRET_V1
              valueFrom:
                secretKeyRef:
                  name: nkz-network-controller-secret
                  key: factory-secret-v1
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: secret
            - name: HEADSCALE_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: headscale_public_url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: cors_origins
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vpn-api-service
  namespace: nekazari
  labels:
    app: vpn-backend
    module: vpn
spec:
  selector:
    app: vpn-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
# Device certificates: create/read/delete cert-manager CertificateRequests only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpn-backend-sa
  namespace: nekazari
  labels:
    app: vpn-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpn-backend-certificaterequests
  namespace: nekazari
  labels:
    app: vpn-backend
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpn-backend-certificaterequests
  namespace: nekazari
  labels:
    app: vpn-backend
subjects:
  - kind: ServiceAccount
    name: vpn-backend-sa
    namespace: nekazari
roleRef:
  kind: Role
  name: vpn-backend-certificaterequests
  apiGroup: rbac.authorization.k8s.io
